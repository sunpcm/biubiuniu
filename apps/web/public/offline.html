<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · NEXTY.DEV</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        opacity: 0.7;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: oklch(0.5854 0.2041 277.1173);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 9999px;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="NEXTY.DEV" />
      <h1>You're offline</h1>
      <p>
        We couldn't reach the network. Check your connection and try again —
        pages you've already visited are still available.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
